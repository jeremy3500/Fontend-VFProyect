<div class="login-container">
  <div class="login-card">
    <button class="btn-volver" (click)="volver()">← Volver</button>
    
    <div class="login-header">
      <h1>Acceso Personal</h1>
      <p>Inicia sesión para acceder a tu panel</p>
    </div>

    <form (ngSubmit)="iniciarSesion()" novalidate>
      <!-- Campo Correo -->
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <div class="input-wrapper">
          <span class="icon">📧</span>
          <input
            type="text"
            id="correo"
            [(ngModel)]="correo"
            name="correo"
            placeholder="ejemplo@gym.com"
          />
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Ingresa tu contraseña"
          />
          <button
            type="button"
            class="btn-mostrar"
            (click)="alternarPassword()"
          >
            {{ mostrarPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <!-- Mensaje de Error -->
      <div class="error-message" *ngIf="error">
        ⚠️ {{ error }}
      </div>

      <!-- Botón Iniciar Sesión -->
      <button type="submit" class="btn-login" [disabled]="cargando">
        {{ cargando ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <!-- Credenciales de Demostración -->
    <div class="demo-info">
      <h3>Credenciales de Demostración</h3>
      <div class="demo-user">
        <p><strong>👨‍💼 Recepcionista:</strong></p>
        <p>Correo: <code>recepcionista&#64;gym.com</code></p>
        <p>Contraseña: <code>123456</code></p>
      </div>
      <div class="demo-user">
        <p><strong>👔 Administrador:</strong></p>
        <p>Correo: <code>admin&#64;gym.com</code></p>
        <p>Contraseña: <code>123456</code></p>
      </div>
      <div class="demo-user">
        <p><strong>🏃 Instructor:</strong></p>
        <p>Correo: <code>instructor&#64;gym.com</code></p>
        <p>Contraseña: <code>123456</code></p>
      </div>
    </div>
  </div>
</div>
