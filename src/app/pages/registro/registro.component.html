<div class="registro-container">
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <button class="btn-volver" (click)="volver()">← Volver</button>
      <h1 class="logo">Gimnasio <span class="logo-fit">VidaFit</span></h1>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <div class="registro-form">
        <h2 class="form-title">Crea tu usuario</h2>

        <!-- Tipo de Identificación -->
        <div class="form-group">
          <label class="form-label">Tipo de Identificación</label>
          <select class="form-input" [(ngModel)]="formulario.tipoIdentificacion" name="tipoIdentificacion">
            <option value="" disabled>Tipo de Identificación</option>
            <option *ngFor="let tipo of tiposIdentificacion" [value]="tipo">{{ tipo }}</option>
          </select>
        </div>

        <!-- Documento de Identificación -->
        <div class="form-group">
          <label class="form-label">Documento de Identificación</label>
          <input 
            type="text" 
            class="form-input" 
            placeholder="Ingrese su documento"
            [(ngModel)]="formulario.documentoIdentificacion"
            name="documentoIdentificacion">
        </div>

        <!-- Nombre y Apellido -->
        <div class="form-group">
          <label class="form-label">Nombre y Apellido</label>
          <input 
            type="text" 
            class="form-input" 
            placeholder="Ingrese su nombre completo"
            [(ngModel)]="formulario.nombreApellido"
            name="nombreApellido">
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
          <label class="form-label">Correo Electrónico</label>
          <input 
            type="email" 
            class="form-input" 
            placeholder="Ej. usuario@smartfit.com"
            [(ngModel)]="formulario.correo"
            name="correo">
        </div>

        <!-- Sexo -->
        <div class="form-group">
          <label class="form-label">Sexo</label>
          <select class="form-input" [(ngModel)]="formulario.sexo" name="sexo">
            <option value="" disabled>Toque para elegir</option>
            <option *ngFor="let sexo of sexos" [value]="sexo">{{ sexo }}</option>
          </select>
        </div>

        <!-- Teléfono Celular -->
        <div class="form-group">
          <label class="form-label">Teléfono Celular</label>
          <input 
            type="tel" 
            class="form-input" 
            placeholder="Ej. +51 912 345 678"
            [(ngModel)]="formulario.telefonoCelular"
            name="telefonoCelular">
        </div>

        <!-- Fecha de Nacimiento -->
        <div class="form-group">
          <label class="form-label">Fecha de Nacimiento</label>
          <input 
            type="date" 
            class="form-input"
            [(ngModel)]="formulario.fechaNacimiento"
            name="fechaNacimiento">
        </div>

        <!-- Política de Privacidad -->
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              [(ngModel)]="formulario.aceptaPrivacidad"
              name="aceptaPrivacidad"
              class="checkbox-input">
            <span>¿Acepta nuestra <a href="#" class="link">política de privacidad?</a></span>
          </label>
          <div class="checkbox-options">
            <label class="radio-label">
              <input type="radio" name="privacidad" class="radio-input">
              <span>ACEPTO</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="privacidad" class="radio-input">
              <span>NO ACEPTO</span>
            </label>
          </div>
        </div>

        <!-- Comunicaciones -->
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              [(ngModel)]="formulario.recibeSMS"
              name="recibeSMS"
              class="checkbox-input">
            <span>Acepto recibir comunicaciones de Smart Fit por SMS</span>
          </label>
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              [(ngModel)]="formulario.recibeWhatsApp"
              name="recibeWhatsApp"
              class="checkbox-input">
            <span>Acepto recibir comunicaciones de Smart Fit por WhatsApp</span>
          </label>
        </div>

        <!-- Botón Continuar -->
        <button class="btn-continuar" (click)="continuar()">Continuar el registro</button>
      </div>
    </div>
  </main>
</div>
